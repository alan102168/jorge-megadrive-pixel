name: ROM Pixel Art - Mega Drive M8 Lite

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tools/**"
      - ".github/workflows/megadrive-rom.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Preparar Python para artes 16 bits
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerar tiles, sprites e preview pixel art
        run: |
          python -m pip install pillow
          python tools/generate_art.py
          test -s src/graphics.h
          test -s dist/preview-pixelart.png

      - name: Compilar jogo de Mega Drive usando SGDK
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:/m68k" \
            registry.gitlab.com/doragasu/docker-sgdk:v2.00
          test -s out/rom.bin
          mkdir -p dist
          cp out/rom.bin dist/Jorge_Truck_Driver.bin

      - name: Criar capa e verificar ROM
        run: |
          python tools/create_cover.py
          python tools/verify_rom.py dist/Jorge_Truck_Driver.bin
          cd dist
          zip -9 Jorge_Truck_Driver_M8_Lite.zip Jorge_Truck_Driver.bin Jorge_Truck_Driver.png

      - name: Anexar ROM, capa e pacote para download
        uses: actions/upload-artifact@v4
        with:
          name: Jorge-MegaDrive-M8-Lite
          path: dist/
          if-no-files-found: error

      - name: Publicar no GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="rom-pixel-v2.0.${{ github.run_number }}"
          gh release create "$VERSION" \
            dist/Jorge_Truck_Driver.bin \
            dist/Jorge_Truck_Driver.png \
            dist/Jorge_Truck_Driver_M8_Lite.zip \
            dist/preview-pixelart.png \
            --target "$GITHUB_SHA" \
            --title "Jorge Truck Driver - Mega Drive (M8 Lite) $VERSION" \
            --notes "Versao Pixel Art 16 bits do Jorge, compilado com SGDK para Mega Drive. A compatibilidade com cada revisao do M8 Lite ainda precisa ser testada no aparelho. Nao substitua os arquivos do sistema do Game Stick."
